id: T-edit_fields-01009
title: 在 TextEdit 里打开的 todo.txt 中，把 状态 改为 草稿，人数
surface: editor
tags:
- train
- textedit
- train
- edit_fields
app: com.apple.TextEdit
goal: 在 TextEdit 里打开的 todo.txt 中，把 状态 改为 草稿，人数 由 1000 改为 1900，其他不变，然后保存。
fixture: train/T-edit_fields-01009
reset_apps:
- com.apple.TextEdit
stage:
