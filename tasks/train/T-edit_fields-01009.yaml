        value: 'Quarterly report

          状态: 草稿

          人数: 1900

          '
oracle_effect:
- 'cat > ''todo.txt'' <<''HANDS_EOF''

  Quarterly report

  状态: 草稿

  人数: 1900

  HANDS_EOF'
