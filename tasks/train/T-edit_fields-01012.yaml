id: T-edit_fields-01012
title: In notes.txt (already open in TextEdit),
surface: editor
tags:
- train
- textedit
- train
- edit_fields
app: com.apple.TextEdit
goal: In notes.txt (already open in TextEdit), set 状态 to 已完成 and change 额度 from 4500
  to 4600. Keep the other lines. Save when done.
fixture: train/T-edit_fields-01012
reset_apps:
- com.apple.TextEdit
stage:
- open -a TextEdit "$WS/notes.txt"
budget:
  max_actions: 25
  wall_clock_s: 900
sentinels:
- $WS/keep/reference.txt
grade:
  checkpoints:
  - name: exact
    critical: true
    check:
      file_text_equals:
        path: $WS/notes.txt
        normalise: nfc_rstrip
        value: 'Quarterly review

          状态: 已完成

          额度: 4600

          '
oracle_effect:
- 'cat > ''notes.txt'' <<''HANDS_EOF''

  Quarterly review

  状态: 已完成

  额度: 4600

  HANDS_EOF'
