id: T-roundtrip-01012
title: Read the 发票号 and 订单号 from 原始.txt and wri
surface: editor
tags:
- train
- textedit
- train
- roundtrip
app: com.apple.TextEdit
goal: Read the 发票号 and 订单号 from 原始.txt and write them into 结果.txt as one line in the
  format `发票号,订单号`. Values only. Save.
fixture: train/T-roundtrip-01012
reset_apps:
- com.apple.TextEdit
stage:
- open -a TextEdit "$WS/结果.txt"
- open -a TextEdit "$WS/原始.txt"
budget:
  max_actions: 20
  wall_clock_s: 900
sentinels:
- $WS/keep/reference.txt
- $WS/原始.txt
grade:
  checkpoints:
  - name: written
    critical: true
    check:
      file_text_equals:
        path: $WS/结果.txt
        normalise: nfc_rstrip
        value: C-8871,6275
oracle_effect:
- 'cat > ''结果.txt'' <<''HANDS_EOF''

  C-8871,6275

  HANDS_EOF'
