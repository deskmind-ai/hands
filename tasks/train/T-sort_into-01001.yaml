id: T-sort_into-01001
title: Gather all the .csv files into a new fol
surface: finder
tags:
- train
- finder
- train
- sort_into
app: com.apple.finder
goal: Gather all the .csv files into a new folder called 草稿.
fixture: train/T-sort_into-01001
budget:
  max_actions: 30
  wall_clock_s: 600
sentinels:
- $WS/keep/reference.txt
grade:
