      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
oracle_effect:
- mkdir '草稿'
- mv '周报-55.csv' '草稿/'
- mv 'report-8.csv' '草稿/'
- mv 'agenda-34.csv' '草稿/'
