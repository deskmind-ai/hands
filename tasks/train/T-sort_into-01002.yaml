id: T-sort_into-01002
title: 把工作目录里的 .log 文件归到一个新文件夹 reports 里。
surface: finder
tags:
- train
- finder
- train
- sort_into
app: com.apple.finder
goal: 把工作目录里的 .log 文件归到一个新文件夹 reports 里。
fixture: train/T-sort_into-01002
budget:
