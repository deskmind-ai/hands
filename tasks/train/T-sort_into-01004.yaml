id: T-sort_into-01004
title: 'Create reports and move every .log file '
surface: finder
tags:
- train
- finder
- train
- sort_into
app: com.apple.finder
goal: Create reports and move every .log file into it; other files stay where they
  are.
fixture: train/T-sort_into-01004
budget:
