      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
oracle_effect:
- mkdir 'reports'
- mv '预算-8.log' 'reports/'
- mv '会议纪要-95.log' 'reports/'
- mv 'summary-39.log' 'reports/'
