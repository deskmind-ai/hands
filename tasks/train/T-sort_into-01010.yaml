id: T-sort_into-01010
title: Gather all the .md files into a new fold
surface: finder
tags:
- train
- finder
- train
- sort_into
app: com.apple.finder
goal: Gather all the .md files into a new folder called invoices.
fixture: train/T-sort_into-01010
budget:
