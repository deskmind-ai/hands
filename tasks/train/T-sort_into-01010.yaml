      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
oracle_effect:
- mkdir 'invoices'
- mv 'draft-76.md' 'invoices/'
- mv '说明-91.md' 'invoices/'
- mv 'report-26.md' 'invoices/'
