id: T-sort_into-01012
title: 'Create 图片 and move every .txt file into '
surface: finder
tags:
- train
- finder
- train
- sort_into
app: com.apple.finder
goal: Create 图片 and move every .txt file into it; other files stay where they are.
fixture: train/T-sort_into-01012
budget:
  max_actions: 30
  wall_clock_s: 600
sentinels:
- $WS/keep/reference.txt
grade:
  checkpoints:
  - name: folder
    check:
      file_exists:
        path: $WS/图片
  - name: moved
    critical: true
    check:
      dir_manifest:
        dir: $WS/图片
        value:
        - todo-68.txt
        - 记录-53.txt
        - 记录-96.txt
  guards:
  - file_exists:
      path: $WS/清单-39.md
  - file_exists:
      path: $WS/记录-57.csv
  forbid:
  - file_exists:
      path: $WS/untitled folder
  - file_exists:
      path: $WS/未命名文件夹
oracle_effect:
- mkdir '图片'
- mv '记录-53.txt' '图片/'
- mv 'todo-68.txt' '图片/'
- mv '记录-96.txt' '图片/'
