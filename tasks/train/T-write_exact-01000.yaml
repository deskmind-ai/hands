id: T-write_exact-01000
title: 周报.txt is open and empty. Type exactly t
surface: editor
tags:
- train
- textedit
- train
- write_exact
app: com.apple.TextEdit
goal: '周报.txt is open and empty. Type exactly the following, punctuation and line
  breaks included, then save:

  库存周转天数为 3274 天，同比下降 13.5%。

  一季度营收 9462 万元，环比增长 15.2%。'
fixture: train/T-write_exact-01000
reset_apps:
- com.apple.TextEdit
stage:
- open -a TextEdit "$WS/周报.txt"
budget:
  max_actions: 20
  wall_clock_s: 900
sentinels:
- $WS/keep/reference.txt
grade:
  checkpoints:
  - name: exact
    critical: true
    check:
      file_text_equals:
        path: $WS/周报.txt
        normalise: nfc_rstrip
        value: '库存周转天数为 3274 天，同比下降 13.5%。

          一季度营收 9462 万元，环比增长 15.2%。

          '
oracle_effect:
- 'cat > ''周报.txt'' <<''HANDS_EOF''

  库存周转天数为 3274 天，同比下降 13.5%。

  一季度营收 9462 万元，环比增长 15.2%。

  HANDS_EOF'
