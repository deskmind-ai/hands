id: T-write_exact-01002
title: Enter this text verbatim into budget.txt
surface: editor
tags:
- train
- textedit
- train
- write_exact
app: com.apple.TextEdit
goal: 'Enter this text verbatim into budget.txt and save it:

  本月新增客户 4 家，流失 8 家。'
fixture: train/T-write_exact-01002
reset_apps:
- com.apple.TextEdit
stage:
- open -a TextEdit "$WS/budget.txt"
budget:
  max_actions: 20
  wall_clock_s: 900
sentinels:
- $WS/keep/reference.txt
grade:
  checkpoints:
  - name: exact
    critical: true
    check:
      file_text_equals:
        path: $WS/budget.txt
        normalise: nfc_rstrip
        value: '本月新增客户 4 家，流失 8 家。

          '
oracle_effect:
- 'cat > ''budget.txt'' <<''HANDS_EOF''

  本月新增客户 4 家，流失 8 家。

  HANDS_EOF'
