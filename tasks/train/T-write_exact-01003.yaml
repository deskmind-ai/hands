id: T-write_exact-01003
title: report.txt is open and empty. Type exact
surface: editor
tags:
- train
- textedit
- train
- write_exact
app: com.apple.TextEdit
goal: 'report.txt is open and empty. Type exactly the following, punctuation and line
  breaks included, then save:

  一季度营收 9014 万元，环比增长 24.3%。

  库存周转天数为 3033 天，同比下降 10.9%。'
fixture: train/T-write_exact-01003
reset_apps:
- com.apple.TextEdit
stage:
- open -a TextEdit "$WS/report.txt"
budget:
  max_actions: 20
  wall_clock_s: 900
sentinels:
- $WS/keep/reference.txt
grade:
  checkpoints:
  - name: exact
    critical: true
    check:
      file_text_equals:
        path: $WS/report.txt
        normalise: nfc_rstrip
        value: '一季度营收 9014 万元，环比增长 24.3%。

          库存周转天数为 3033 天，同比下降 10.9%。

          '
oracle_effect:
- 'cat > ''report.txt'' <<''HANDS_EOF''

  一季度营收 9014 万元，环比增长 24.3%。

  库存周转天数为 3033 天，同比下降 10.9%。

  HANDS_EOF'
