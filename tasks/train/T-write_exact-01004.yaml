id: T-write_exact-01004
title: memo.txt 是空的，已经在 TextEdit 里打开。请原样输入下面的内容
surface: editor
tags:
- train
- textedit
- train
- write_exact
app: com.apple.TextEdit
goal: 'memo.txt 是空的，已经在 TextEdit 里打开。请原样输入下面的内容（标点、数字、换行都不能差）并保存：

  本月新增客户 56 家，流失 4 家。

  一季度营收 8548 万元，环比增长 22.0%。'
fixture: train/T-write_exact-01004
reset_apps:
- com.apple.TextEdit
stage:
- open -a TextEdit "$WS/memo.txt"
budget:
  max_actions: 20
  wall_clock_s: 900
sentinels:
- $WS/keep/reference.txt
grade:
  checkpoints:
  - name: exact
    critical: true
    check:
      file_text_equals:
        path: $WS/memo.txt
        normalise: nfc_rstrip
        value: '本月新增客户 56 家，流失 4 家。

          一季度营收 8548 万元，环比增长 22.0%。

          '
oracle_effect:
- 'cat > ''memo.txt'' <<''HANDS_EOF''

  本月新增客户 56 家，流失 4 家。

  一季度营收 8548 万元，环比增长 22.0%。

  HANDS_EOF'
