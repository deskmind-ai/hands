id: T-write_exact-01005
title: report.txt is open and empty. Type exact
surface: editor
tags:
- train
- textedit
- train
- write_exact
app: com.apple.TextEdit
goal: 'report.txt is open and empty. Type exactly the following, punctuation and line
  breaks included, then save:

  8 tickets remain open; 7 are overdue.

  一季度营收 9274 万元，环比增长 3.7%。'
fixture: train/T-write_exact-01005
reset_apps:
- com.apple.TextEdit
stage:
- open -a TextEdit "$WS/report.txt"
budget:
  max_actions: 20
  wall_clock_s: 900
sentinels:
- $WS/keep/reference.txt
grade:
