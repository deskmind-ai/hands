    critical: true
    check:
      file_text_equals:
        path: $WS/report.txt
        normalise: nfc_rstrip
        value: '8 tickets remain open; 7 are overdue.

          一季度营收 9274 万元，环比增长 3.7%。

          '
oracle_effect:
- 'cat > ''report.txt'' <<''HANDS_EOF''

  8 tickets remain open; 7 are overdue.

  一季度营收 9274 万元，环比增长 3.7%。

  HANDS_EOF'
