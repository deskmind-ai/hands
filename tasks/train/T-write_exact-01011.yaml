          库存周转天数为 8922 天，同比下降 16.8%。

          '
oracle_effect:
- 'cat > ''draft.txt'' <<''HANDS_EOF''

  77 tickets remain open; 3 are overdue.

  库存周转天数为 8922 天，同比下降 16.8%。

  HANDS_EOF'
